# Port Scanner Configuration
# This file defines which hosts to scan and which ports are expected to be open

# Global scanner settings
scanner:
  # Interval between complete scan cycles (in seconds)
  scan_interval_secs: 60

  # Number of parallel connections/scans
  parallelism: 100

  # Delay between individual port scans (in milliseconds)
  scan_delay_ms: 10

  # TCP connection timeout (in milliseconds)
  tcp_timeout_ms: 3000

  # UDP probe timeout (in milliseconds)
  udp_timeout_ms: 5000

  # DNS resolution timeout (in seconds)
  dns_timeout_secs: 5

# Prometheus metrics server settings
metrics:
  # Address to bind the metrics server to
  address: "0.0.0.0"
  # Port for the metrics server
  port: 9090

# List of hosts to scan
hosts:
  # Example: Web server
  - name: "webserver.example.com"
    # Optional: specify IP to bypass DNS resolution
    # ip: 192.168.1.10
    description: "Main web server"
    
    # TCP ports that SHOULD be open
    expected_tcp_ports:
      - 22    # SSH
      - 80    # HTTP
      - 443   # HTTPS
    
    # UDP ports that SHOULD be open
    expected_udp_ports: []
    
    # Optional: additional TCP ports to scan beyond expected ones
    # scan_tcp_ports:
    #   - "1-1024"  # Scan all privileged ports
    
    # Scan common ports (1-1024) in addition to specified ports
    scan_common_ports: false
    
    # Scan all ports (1-65535) - use with caution!
    scan_all_ports: false

  # Example: Database server
  - name: "database.example.com"
    ip: 10.0.0.50  # Bypass DNS resolution
    description: "PostgreSQL database server"
    
    expected_tcp_ports:
      - 22      # SSH
      - 5432    # PostgreSQL
    
    expected_udp_ports: []

  # Example: Mail server
  - name: "mail.example.com"
    description: "Email server"
    
    expected_tcp_ports:
      - 22    # SSH
      - 25    # SMTP
      - 465   # SMTPS
      - 587   # Submission
      - 993   # IMAPS
      - 995   # POP3S
    
    expected_udp_ports: []
    
    # Scan common ports to detect unexpected services
    scan_common_ports: true

  # Example: DNS server
  - name: "dns.example.com"
    ip: 10.0.0.53
    description: "Internal DNS server"
    
    expected_tcp_ports:
      - 22   # SSH
      - 53   # DNS
    
    expected_udp_ports:
      - 53   # DNS

  # Example: Using port ranges
  - name: "app-cluster.example.com"
    description: "Application cluster with multiple services"
    
    expected_tcp_ports:
      - 22          # SSH
      - 80          # HTTP
      - 443         # HTTPS
      - "8080-8089" # Application ports range
      - [3000, 3001, 3002]  # Specific ports as list
    
    expected_udp_ports: []
