[package]
name = "port-scanner"
version = "0.1.0"
edition = "2021"
description = "Continuous network port scanner with Prometheus metrics"
authors = ["Port Scanner Team"]

[dependencies]
# Async runtime
tokio = { version = "1.34", features = ["full", "sync", "time", "net", "rt-multi-thread", "macros"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"

# CLI arguments
clap = { version = "4.4", features = ["derive"] }

# Prometheus metrics
prometheus = { version = "0.13", features = ["process"] }
hyper = { version = "1.1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
futures = "0.3"
socket2 = { version = "0.5", features = ["all"] }

# DNS resolution - use dns-lookup for simple resolution
dns-lookup = "2.0"

[profile.release]
opt-level = 3
lto = true
