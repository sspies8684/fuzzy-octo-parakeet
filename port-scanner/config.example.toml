# Port Scanner Configuration (TOML format)
# Alternative to YAML configuration

[scanner]
scan_interval_secs = 60
parallelism = 100
scan_delay_ms = 10
tcp_timeout_ms = 3000
udp_timeout_ms = 5000
dns_timeout_secs = 5

[metrics]
address = "0.0.0.0"
port = 9090

# Web server example
[[hosts]]
name = "webserver.example.com"
description = "Main web server"
expected_tcp_ports = [22, 80, 443]
expected_udp_ports = []
scan_common_ports = false
scan_all_ports = false

# Database server example
[[hosts]]
name = "database.example.com"
ip = "10.0.0.50"
description = "PostgreSQL database server"
expected_tcp_ports = [22, 5432]
expected_udp_ports = []

# DNS server example
[[hosts]]
name = "dns.example.com"
ip = "10.0.0.53"
description = "Internal DNS server"
expected_tcp_ports = [22, 53]
expected_udp_ports = [53]
