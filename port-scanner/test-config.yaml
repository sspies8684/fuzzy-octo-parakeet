# Test configuration for port scanner

scanner:
  scan_interval_secs: 30
  parallelism: 50
  scan_delay_ms: 5
  tcp_timeout_ms: 2000
  udp_timeout_ms: 3000
  dns_timeout_secs: 3

metrics:
  address: "0.0.0.0"
  port: 9090

hosts:
  # Scan localhost to test
  - name: "localhost"
    ip: 127.0.0.1
    description: "Local machine"
    expected_tcp_ports:
      - 22    # SSH (might be open)
    expected_udp_ports: []
